name: Go CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2

      - name: Set up Go ⚙️
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: Install dependencies
        run: make install

      - name: Check formatting
        run: make fmt-check

      - name: Lint
        run: make lint

      - name: Test 🚨
        run: make test

      - name: Build 🏗️
        run: make build
